<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Hindi ↔ English Translator</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    color:#111827;
    padding:20px;
}

body.dark{
    background:#0f172a;
    color:#f8fafc;
}

.container{
    max-width:1100px;
    margin:auto;
}

header{
    background:white;
    padding:20px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:20px;
}

.dark header,
.dark .card{
    background:#1e293b;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.logo span{
    color:#4f46e5;
}

.theme{
    border:0;
    background:#eef2ff;
    padding:10px 15px;
    border-radius:10px;
    cursor:pointer;
    font-size:18px;
}

.card{
    background:white;
    padding:25px;
    border-radius:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:20px;
}

select,button{
    border:1px solid #d1d5db;
    padding:12px 15px;
    border-radius:10px;
    background:white;
    cursor:pointer;
}

button:hover{
    transform:translateY(-1px);
}

.primary{
    background:#4f46e5;
    color:white;
    border:none;
}

.swap{
    font-size:20px;
}

.workspace{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.box{
    border:1px solid #dbe1ea;
    border-radius:15px;
    overflow:hidden;
}

.box-title{
    background:#f1f5f9;
    padding:12px 15px;
    font-weight:bold;
}

.dark .box-title{
    background:#334155;
}

textarea{
    width:100%;
    height:280px;
    border:0;
    resize:none;
    padding:18px;
    font-size:17px;
    outline:none;
    background:transparent;
    color:inherit;
}

.bottom{
    display:flex;
    justify-content:space-between;
    padding:10px 15px;
    border-top:1px solid #e5e7eb;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:20px;
}

.history{
    margin-top:20px;
}

.history-item{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
    margin-top:10px;
    cursor:pointer;
}

.dark .history-item{
    background:#334155;
}

.status{
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    display:none;
}

.loading{
    display:inline-block;
    width:18px;
    height:18px;
    border:3px solid #ddd;
    border-top:3px solid #4f46e5;
    border-radius:50%;
    animation:spin 1s linear infinite;
    vertical-align:middle;
}

@keyframes spin{
    to{transform:rotate(360deg)}
}

footer{
    text-align:center;
    margin-top:20px;
    color:#64748b;
}

@media(max-width:750px){
    .workspace{
        grid-template-columns:1fr;
    }

    header{
        gap:10px;
    }

    .logo{
        font-size:20px;
    }

    textarea{
        height:220px;
    }
}
</style>
</head>

<body>

<div class="container">

<header>
    <div class="logo">
        🌐 <span>AI Translator</span>
    </div>

    <button class="theme" onclick="toggleTheme()">🌙</button>
</header>

<div class="card">

<div class="controls">

<select id="from">
    <option value="auto">Auto Detect</option>
    <option value="Hindi">Hindi</option>
    <option value="English">English</option>
</select>

<button class="swap" onclick="swapLanguages()">⇄</button>

<select id="to">
    <option value="English">English</option>
    <option value="Hindi">Hindi</option>
</select>

<button onclick="translateText()" class="primary">
    ✨ Translate
</button>

</div>

<div class="workspace">

<div class="box">

<div class="box-title">
    📝 Input
</div>

<textarea
id="inputText"
placeholder="Hindi या English text यहाँ लिखें..."></textarea>

<div class="bottom">
    <span id="inputCount">0 characters</span>

    <button onclick="clearInput()">
        🗑️ Clear
    </button>
</div>

</div>


<div class="box">

<div class="box-title">
    🌐 Translation
</div>

<textarea
id="outputText"
readonly
placeholder="Translation यहाँ दिखाई देगा..."></textarea>

<div class="bottom">

<span id="outputCount">0 characters</span>

<button onclick="copyTranslation()">
    📋 Copy
</button>

</div>

</div>

</div>


<div class="actions">

<button onclick="speakInput()">
    🔊 Speak Input
</button>

<button onclick="speakOutput()">
    🔊 Speak Translation
</button>

<button onclick="startVoice()">
    🎤 Voice Input
</button>

<button onclick="downloadTranslation()">
    💾 Download
</button>

<button onclick="clearAll()">
    🧹 Clear All
</button>

</div>


<div id="status" class="status"></div>


<div class="history">

<h3>📜 Translation History</h3>

<div id="historyList"></div>

</div>

</div>

<footer>
    AI Hindi ↔ English Translator • Powered by Groq
</footer>

</div>


<script>

/* =====================================================
   GROQ API KEY
   WARNING:
   Putting API keys here exposes them to browser users.
   For production use, use a backend proxy.
===================================================== */

const GROQ_API_KEY = "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";


/* Current Groq model */
const GROQ_MODEL = "openai/gpt-oss-20b";


/* Elements */

const inputText = document.getElementById("inputText");
const outputText = document.getElementById("outputText");
const from = document.getElementById("from");
const to = document.getElementById("to");
const statusBox = document.getElementById("status");


/* Character counter */

inputText.addEventListener("input", () => {

    document.getElementById("inputCount").innerText =
        inputText.value.length + " characters";

});


/* Translation */

async function translateText(){

    const text = inputText.value.trim();

    if(!text){

        showStatus("Please enter some text.", "error");
        return;

    }

    if(GROQ_API_KEY === "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"){

        showStatus(
            "Please add your Groq API key inside the code first.",
            "error"
        );

        return;
    }


    showStatus(
        '<span class="loading"></span> Translating...',
        "loading"
    );


    let targetLanguage = to.value;

    let sourceLanguage = from.value;


    const prompt = `

You are a professional Hindi-English translator.

Translate the following text.

Source language:
${sourceLanguage}

Target language:
${targetLanguage}

Rules:

1. Translate naturally.
2. Preserve the original meaning.
3. Do not add explanations.
4. Do not add quotation marks.
5. Preserve names, numbers and important formatting.
6. If source language is Auto Detect, identify it automatically.
7. Return ONLY the translated text.

Text:

${text}

`;


    try{

        const response = await fetch(
            "https://api.groq.com/openai/v1/chat/completions",
            {

                method:"POST",

                headers:{
                    "Content-Type":"application/json",
                    "Authorization":"Bearer " + GROQ_API_KEY
                },

                body:JSON.stringify({

                    model:GROQ_MODEL,

                    messages:[
                        {
                            role:"system",
                            content:
                            "You are an expert Hindi and English translator."
                        },
                        {
                            role:"user",
                            content:prompt
                        }
                    ],

                    temperature:0.2,

                    max_completion_tokens:2000

                })

            }
        );


        const data = await response.json();


        if(!response.ok){

            throw new Error(
                data.error?.message ||
                "Groq API request failed"
            );

        }


        const result =
            data.choices?.[0]?.message?.content?.trim();


        if(!result){

            throw new Error("No translation received.");

        }


        outputText.value = result;

        document.getElementById("outputCount").innerText =
            result.length + " characters";


        showStatus(
            "✅ Translation completed successfully.",
            "success"
        );


        saveHistory(text,result);

    }

    catch(error){

        console.error(error);

        showStatus(
            "❌ Error: " + error.message,
            "error"
        );

    }

}


/* Swap languages */

function swapLanguages(){

    if(from.value === "auto"){

        from.value = "English";
        to.value = "Hindi";

    }else{

        const oldFrom = from.value;

        from.value = to.value;
        to.value = oldFrom;

    }


    const input = inputText.value;
    const output = outputText.value;

    inputText.value = output;
    outputText.value = input;


    updateCounters();

}


/* Clear input */

function clearInput(){

    inputText.value = "";

    updateCounters();

    inputText.focus();

}


/* Clear everything */

function clearAll(){

    inputText.value = "";
    outputText.value = "";

    updateCounters();

    showStatus(
        "🧹 Cleared.",
        "success"
    );

}


/* Copy */

async function copyTranslation(){

    if(!outputText.value){

        showStatus(
            "Nothing to copy.",
            "error"
        );

        return;

    }


    try{

        await navigator.clipboard.writeText(
            outputText.value
        );

        showStatus(
            "📋 Translation copied!",
            "success"
        );

    }catch{

        outputText.select();

        document.execCommand("copy");

        showStatus(
            "📋 Copied!",
            "success"
        );

    }

}


/* Text to Speech */

function speakInput(){

    speak(inputText.value);

}


function speakOutput(){

    speak(outputText.value);

}


function speak(text){

    if(!text){

        showStatus(
            "Nothing to speak.",
            "error"
        );

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(text);


    if(/[ऀ-ॿ]/.test(text)){

        utterance.lang = "hi-IN";

    }else{

        utterance.lang = "en-US";

    }


    utterance.rate = 0.9;

    speechSynthesis.speak(utterance);

}


/* Voice Input */

function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        showStatus(
            "Voice input is not supported in this browser.",
            "error"
        );

        return;

    }


    const recognition =
        new SpeechRecognition();


    recognition.lang =
        from.value === "Hindi"
        ? "hi-IN"
        : "en-US";


    recognition.interimResults = false;


    showStatus(
        "🎤 Listening...",
        "loading"
    );


    recognition.start();


    recognition.onresult = function(event){

        const text =
            event.results[0][0].transcript;


        inputText.value = text;

        updateCounters();

        showStatus(
            "🎤 Voice captured.",
            "success"
        );

    };


    recognition.onerror = function(event){

        showStatus(
            "Voice error: " + event.error,
            "error"
        );

    };

}


/* Download */

function downloadTranslation(){

    if(!outputText.value){

        showStatus(
            "Nothing to download.",
            "error"
        );

        return;

    }


    const content =
        "AI Translator\n\n" +
        "Original:\n" +
        inputText.value +
        "\n\nTranslation:\n" +
        outputText.value;


    const blob =
        new Blob(
            [content],
            {type:"text/plain"}
        );


    const url =
        URL.createObjectURL(blob);


    const a =
        document.createElement("a");


    a.href = url;

    a.download =
        "translation.txt";


    a.click();


    URL.revokeObjectURL(url);

}


/* History */

function saveHistory(input,output){

    let history =
        JSON.parse(
            localStorage.getItem("translatorHistory") ||
            "[]"
        );


    history.unshift({

        input:input,
        output:output,
        date:new Date().toLocaleString()

    });


    history =
        history.slice(0,10);


    localStorage.setItem(
        "translatorHistory",
        JSON.stringify(history)
    );


    displayHistory();

}


function displayHistory(){

    const list =
        document.getElementById("historyList");


    let history =
        JSON.parse(
            localStorage.getItem("translatorHistory") ||
            "[]"
        );


    if(history.length === 0){

        list.innerHTML =
            "<p>No translation history yet.</p>";

        return;

    }


    list.innerHTML =
        history.map((item,index)=>`

        <div
        class="history-item"
        onclick="loadHistory(${index})">

            <strong>
                ${escapeHtml(
                    item.input.substring(0,80)
                )}
            </strong>

            <br>

            <small>
                ${escapeHtml(
                    item.output.substring(0,120)
                )}
            </small>

            <br>

            <small>
                ${item.date}
            </small>

        </div>

    `).join("");

}


function loadHistory(index){

    const history =
        JSON.parse(
            localStorage.getItem("translatorHistory") ||
            "[]"
        );


    if(!history[index]) return;


    inputText.value =
        history[index].input;


    outputText.value =
        history[index].output;


    updateCounters();

}


function escapeHtml(text){

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


/* Theme */

function toggleTheme(){

    document.body.classList.toggle("dark");

    localStorage.setItem(
        "darkMode",
        document.body.classList.contains("dark")
    );

}


if(
    localStorage.getItem("darkMode") === "true"
){

    document.body.classList.add("dark");

}


/* Status */

function showStatus(message,type){

    statusBox.innerHTML = message;

    statusBox.style.display = "block";


    if(type === "error"){

        statusBox.style.background = "#fee2e2";
        statusBox.style.color = "#991b1b";

    }

    else if(type === "success"){

        statusBox.style.background = "#dcfce7";
        statusBox.style.color = "#166534";

    }

    else{

        statusBox.style.background = "#eef2ff";
        statusBox.style.color = "#3730a3";

    }


    setTimeout(()=>{

        statusBox.style.display = "none";

    },5000);

}


/* Counters */

function updateCounters(){

    document.getElementById("inputCount").innerText =
        inputText.value.length + " characters";


    document.getElementById("outputCount").innerText =
        outputText.value.length + " characters";

}


/* Keyboard shortcut */

document.addEventListener(
    "keydown",
    function(event){

        if(
            (event.ctrlKey || event.metaKey) &&
            event.key === "Enter"
        ){

            translateText();

        }

    }
);


/* Load history */

displayHistory();

</script>

</body>
</html>
